spring.application.name=backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BD_AliviaTech}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${ALIVIATECH_JWT_EXPIRATION_MS:1200000}

# HU02/HU03: la URL apunta al futuro frontend y la versión identifica el texto de términos aceptado.
app.frontend.activacion-url=${ALIVIATECH_FRONTEND_ACTIVACION_URL:http://localhost:4200/activar-cuenta}
app.consentimiento.version=${ALIVIATECH_CONSENTIMIENTO_VERSION:1.0}
app.consentimiento.terminos-url=${ALIVIATECH_TERMINOS_URL:http://localhost:4200/terminos}

# Correo SMTP opcional. Sin ALIVIATECH_MAIL_ENABLED=true la aplicación arranca, pero los envíos responden 503.
app.mail.enabled=${ALIVIATECH_MAIL_ENABLED:true}
app.mail.from=${ALIVIATECH_MAIL_FROM:}
spring.mail.host=${ALIVIATECH_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${ALIVIATECH_SMTP_PORT:587}
spring.mail.username=${ALIVIATECH_SMTP_USERNAME:}
spring.mail.password=${ALIVIATECH_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

# HU31 | END25: credencial y modelo externos para el análisis descriptivo con Gemini.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# HU11 y HU13: simulacion automatica interna de pulseras vinculadas, en horario de America/Lima.
app.wearable.simulador.enabled=${ALIVIATECH_WEARABLE_SIMULATOR_ENABLED:true}
app.wearable.simulador.lecturas-cron=${ALIVIATECH_WEARABLE_READINGS_CRON:0 */15 * * * *}
app.wearable.simulador.resumenes-cron=${ALIVIATECH_WEARABLE_SUMMARIES_CRON:0 5 0 * * *}

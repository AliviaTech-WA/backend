services:
  api:
    image: aliviatech-backend:latest
    build:
      context: .
    container_name: aliviatech-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - type: bind
        source: "${RDS_CA_PATH:?Define RDS_CA_PATH en .env}"
        target: /run/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      - aliviatech

networks:
  aliviatech:
    name: aliviatech
    external: true